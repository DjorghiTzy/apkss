name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build exe
        run: pyinstaller --noconfirm --clean ScreenshotManager.spec
      - name: Portable zip
        run: Compress-Archive -Path dist\ScreenshotManager -DestinationPath dist\ScreenshotManager-portable.zip
      - name: Installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenshotManager-windows
          path: |
            dist/ScreenshotManager-portable.zip
            dist/ScreenshotManager-Setup-*.exe
