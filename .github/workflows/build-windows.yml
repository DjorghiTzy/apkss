name: Build Windows

# Cara rilis (pilih salah satu):
#  - GitHub web: Actions -> Build Windows -> Run workflow (centang "Terbitkan release")
#  - Push tag vX.Y.Z
# Versi diambil dari screenshot_manager/__init__.py (__version__).
#  - Push ke main dengan __version__ baru -> tes, build, dan rilis OTOMATIS (tanpa klik apa pun).
#  - Push ke main dengan versi yang sudah dirilis -> tes + build saja (hasil di Artifacts).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Terbitkan GitHub Release (vX.Y.Z dari __version__)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baca versi
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import screenshot_manager as m; print(m.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$v") {
            Write-Error "Tag $env:GITHUB_REF_NAME tidak sama dengan __version__ ($v). Jalankan tools/bump_version.py dulu."
            exit 1
          }
          gh release view "v$v" *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $publish = $true
          } elseif ($env:GITHUB_EVENT_NAME -eq "push") {
            # push ke main dengan versi baru -> rilis otomatis; versi yang sudah dirilis -> build saja
            $publish = -not $exists
          } else {
            $publish = ("${{ inputs.release }}" -eq "true")
            if ($publish -and $exists) {
              Write-Error "Release v$v sudah ada. Naikkan versi dengan tools/bump_version.py."
              exit 1
            }
          }
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "Versi $v - rilis: $publish (sudah ada: $exists)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build exe
        run: pyinstaller --noconfirm --clean ScreenshotManager.spec

      - name: Uji OCR di .exe (nama paket dari judul "PART nn")
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\ScreenshotManager\ScreenshotManager.exe" -ArgumentList "--selftest-ocr" -Wait -PassThru
          $code = $p.ExitCode
          Write-Host "selftest-ocr exit code: $code"
          $f = Join-Path $env:APPDATA "ScreenshotManager\selftest-ocr.txt"
          if (Test-Path $f) { Write-Host "OCR:"; Get-Content $f }
          if ($code -eq 3) { Write-Error "Modul OCR Windows tidak ikut di dalam .exe"; exit 1 }
          if ($code -eq 1) { Write-Error "OCR membaca judul, tapi nomor PART salah"; exit 1 }
          if ($code -eq 4) { Write-Host "::warning::Mesin build tidak punya bahasa OCR; .exe tetap memuat modul OCR" }
          $global:LASTEXITCODE = 0

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\ScreenshotManager -DestinationPath "dist\ScreenshotManager-${{ steps.ver.outputs.version }}-portable.zip"

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenshotManager-windows-${{ steps.ver.outputs.version }}
          path: |
            dist/ScreenshotManager-*-portable.zip
            dist/ScreenshotManager-Setup-*.exe

      - name: Terbitkan GitHub Release
        if: steps.ver.outputs.publish == 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" --target "$env:GITHUB_SHA" `
            "dist\ScreenshotManager-Setup-${{ steps.ver.outputs.version }}.exe" `
            "dist\ScreenshotManager-${{ steps.ver.outputs.version }}-portable.zip" `
            --title "Screenshot Manager ${{ steps.ver.outputs.version }}" --generate-notes
